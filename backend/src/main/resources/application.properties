# ==============================================================================
# Configuracion de la Aplicacion Tienda NEXO - Proyecto Final Frameworks
# Spring Boot 3.3.5 / Java 21 LTS / PostgreSQL
# ==============================================================================

spring.application.name=nexo-backend
server.port=8080

# ------------------------------------------------------------------------------
# Configuracion del Datasource (PostgreSQL)
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tienda}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# Configuracion de Spring Data JPA / Hibernate
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ------------------------------------------------------------------------------
# Configuracion del Motor de Plantillas Thymeleaf
# ------------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------------------------------------------
# Integracion Externa: SerpAPI (Google Maps Store Locator)
# ------------------------------------------------------------------------------
serpapi.api.key=${SERPAPI_KEY:demo_nexokey_2026}
serpapi.base-url=https://serpapi.com/search.json

# ------------------------------------------------------------------------------
# OpenAPI / Swagger UI
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
